<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a1a; 
            color: #e0e0e0; 
            margin: 0; 
        }
        .container { 
            max-width: 400px; 
            margin: 0 auto; 
            padding: 2em 1em; 
        }
        h2 { 
            color: #ffffff; 
            text-align: center; 
            margin-bottom: 1.5em; 
        }
        p {
            text-align: center;
            color: #b0b0b0;
            font-size: 1.1em;
            margin: 2em 0;
        }
        .button {
            display: block;
            width: 100%;
            padding: 1em;
            margin: 1em 0;
            font-size: 1.2em;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .button:hover { 
            background: #f0f0f0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }
        a { 
            color: #ff4444; 
            text-decoration: none; 
            display: block;
            text-align: center;
            margin-top: 1em;
        }
        a:hover { color: #ff6666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Settings</h2>
        <p>Settings page content goes here.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
