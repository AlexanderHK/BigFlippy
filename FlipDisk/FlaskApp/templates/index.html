<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlipDisk Control</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a1a; 
            color: #e0e0e0; 
            margin: 0; 
        }
        .container { 
            max-width: 400px; 
            margin: 0 auto; 
            padding: 2em 1em; 
        }
        h1, h2 { 
            color: #ffffff; 
            text-align: center; 
            margin-bottom: 1.5em; 
        }
        .button {
            display: block;
            width: 100%;
            padding: 1em;
            margin: 1em 0;
            font-size: 1.2em;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .button:hover { 
            background: #f0f0f0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }
        .flash { 
            color: #4caf50; 
            text-align: center; 
            margin-bottom: 1em; 
            padding: 0.5em;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            border-radius: 8px;
        }
        a { text-decoration: none; }
        
        /* Status indicator styles */
        .status-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            z-index: 1000;
        }
        
        /* Forced mode background */
        body.forced-mode {
            background: linear-gradient(135deg, #3a1a1a, #2a0000);
            transition: background 0.5s ease;
        }
        
        .forced-indicator {
            text-align: center;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 1em;
            padding: 0.5em;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FlipDisk Control</h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form action="/standby" method="post">
            <button class="button" type="submit">Standby</button>
        </form>
        <form action="/weather" method="post">
            <button class="button" type="submit">Weather</button>
        </form>
        <form action="/cycle" method="post">
            <button class="button" type="submit">Cycle</button>
        </form>
        <a href="/upload"><button class="button" type="button">Upload</button></a>
        <a href="/settings"><button class="button" type="button">Settings</button></a>
        <form action="/release" method="post" style="display: none;">
            <button class="button" type="submit" style="background: #ffa500; margin-top: 1.5em;">Release Mode (Auto)</button>
        </form>
    </div>
    
    <!-- Status indicator -->
    <div class="status-indicator" id="status">
        Mode: <span id="current-mode">Loading...</span>
    </div>
    
    <!-- Forced mode indicator -->
    <div class="forced-indicator" id="forced-indicator">
        🔒 FORCED MODE ACTIVE
    </div>
    
    <script>
        let lastStatus = null;
        
        function updateModeButtonStates(data) {
            const currentMode = data.current_mode;
            const isForced = data.is_forced;
            const forcedMode = data.forced_mode;
            
            // Get all mode buttons
            const standbyBtn = document.querySelector('form[action="/standby"] button');
            const weatherBtn = document.querySelector('form[action="/weather"] button');
            const cycleBtn = document.querySelector('form[action="/cycle"] button');
            
            // Reset all buttons to default state
            [standbyBtn, weatherBtn, cycleBtn].forEach(btn => {
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
                btn.disabled = false;
            });
            
            // If a mode is forced, disable buttons for other modes and highlight current
            if (isForced) {
                [standbyBtn, weatherBtn, cycleBtn].forEach(btn => {
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                });
                
                // Highlight the currently forced mode button
                if (forcedMode === 'StandbyMode') {
                    standbyBtn.style.opacity = '1';
                    standbyBtn.style.background = '#90EE90'; // Light green
                } else if (forcedMode === 'WeatherMode') {
                    weatherBtn.style.opacity = '1';
                    weatherBtn.style.background = '#90EE90'; // Light green
                } else if (forcedMode === 'CycleMode') {
                    cycleBtn.style.opacity = '1';
                    cycleBtn.style.background = '#90EE90'; // Light green
                }
            }
            // If already in a mode naturally, show different styling
            else {
                if (currentMode === 'StandbyMode') {
                    standbyBtn.style.background = '#ADD8E6'; // Light blue
                } else if (currentMode === 'WeatherMode') {
                    weatherBtn.style.background = '#ADD8E6'; // Light blue
                } else if (currentMode === 'CycleMode') {
                    cycleBtn.style.background = '#ADD8E6'; // Light blue
                }
            }
        }
        
        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    // Update status indicator
                    document.getElementById('current-mode').textContent = data.current_mode || 'Unknown';
                    
                    // Handle forced mode styling
                    const body = document.body;
                    const forcedIndicator = document.getElementById('forced-indicator');
                    const releaseButton = document.querySelector('form[action="/release"]');
                    
                    if (data.is_forced) {
                        body.classList.add('forced-mode');
                        forcedIndicator.style.display = 'block';
                        forcedIndicator.innerHTML = '🔒 FORCED MODE: ' + (data.forced_mode || data.current_mode);
                        releaseButton.style.display = 'block';
                    } else {
                        body.classList.remove('forced-mode');
                        forcedIndicator.style.display = 'none';
                        releaseButton.style.display = 'none';
                    }
                    
                    // Update mode button states
                    updateModeButtonStates(data);
                    
                    lastStatus = data;
                })
                .catch(error => {
                    console.error('Status update failed:', error);
                    document.getElementById('current-mode').textContent = 'Error';
                });
        }
        
        // Update status every 2 seconds
        updateStatus(); // Initial load
        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
